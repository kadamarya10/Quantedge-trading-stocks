services:
  - type: web
    name: quantedge-terminal
    runtime: python
    plan: free
    region: oregon # or frankfurt / singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

